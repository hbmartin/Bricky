name: Bricky the Brick Scanner
options:
  bundleIdPrefix: com.bricky
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
  groupSortPosition: top
  developmentLanguage: en
packages:
  RecoveryMLX:
    path: Packages/RecoveryMLX
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
settings:
  base:
    DEVELOPMENT_TEAM: 6UN3X7Q6SP
    SWIFT_VERSION: 5.9
    # iPhone only (ADR 0012): the floor is the iPhone 17 Pro class.
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: 27.0
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 6
targets:
  Bricky:
    type: application
    platform: iOS
    sources:
      - Bricky/App
      - Bricky/Domain
      - Bricky/Camera/ARCameraManager.swift
      - Bricky/Camera/ARCameraPreview.swift
      - Bricky/Camera/RegistrationFrameRelay.swift
      - Bricky/Camera/ARActivityClock.swift
      - Bricky/Extensions/UIImage+Orientation.swift
      - Bricky/Services/Instructions
      - Bricky/Services/Recovery
      - Bricky/Services/Registration
      - Bricky/Services/Verification
      - Bricky/Services/Cloud
      - Bricky/Services/Repair
      - Bricky/Services/Voice
      - Bricky/Intents
      - Bricky/Views/EvidenceSessionsView.swift
      - Bricky/Views/LibraryView.swift
      - Bricky/Views/StorageAndAttributionView.swift
      - Bricky/Views/GuideView.swift
      - Bricky/Views/ARGuideView.swift
      - Bricky/Views/Recovery
      - path: Bricky/Resources/Assets.xcassets
        buildPhase: resources
      - path: Bricky/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Bricky/Resources/LDRAW_ATTRIBUTION.txt
        buildPhase: resources
      # Repair wording and verifier labels (ADR 0015).
      - path: Bricky/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bricky.app
        # XcodeGen's iOS preset sets "1,2" on every target, which overrides
        # the project-level iPhone-only setting (ADR 0012).
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: Bricky
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Bricky/Resources/Info.plist
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: Bricky/Resources/App.entitlements
    dependencies:
      - package: RecoveryMLX
        product: RecoveryMLX
      - package: RecoveryMLX
        product: RecoveryEvidenceKit
      - package: RecoveryMLX
        product: BrickyLanguage
      - package: ZIPFoundation
  SyntheticRGBD:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # Fixtures are read from the filesystem by path (CI passes
      # fixtures/real-tower/tower.ldr as an argument); packaging them as
      # target resources put two files named tower.ldr into one build phase.
      - path: Tools/SyntheticScenes
        excludes:
          - "fixtures/**"
      - Bricky/Domain/RecoveryEvidence.swift
      - Bricky/Domain/RecoveryIndexing.swift
      - Bricky/Domain/InstructionDomain.swift
      - Bricky/Domain/RegistrationDomain.swift
      - Bricky/Domain/VerificationDomain.swift
      - Bricky/Domain/VerificationEvidenceReplay.swift
      - Bricky/Domain/BuildDiffDomain.swift
      - Bricky/Domain/RepairDomain.swift
      - Bricky/Domain/StudDomain.swift
      - Bricky/Services/Instructions/LDrawInstructionParser.swift
      - Bricky/Services/Instructions/InstructionPlanBuilder.swift
      - Bricky/Services/Instructions/LDrawGeometryEngine.swift
      - Bricky/Services/Instructions/SegmentedGeometry.swift
      - Bricky/Services/Instructions/PlacementGeometryStore.swift
      - Bricky/Services/Instructions/PlacementGeometryIndex.swift
      - Bricky/Services/Instructions/PartSymmetry.swift
      - Bricky/Services/Instructions/LDConfigPalette.swift
      - Bricky/Services/Registration/ModelSurfaceSampler.swift
      - Bricky/Services/Registration/ExpectedDepthRenderer.swift
      - Bricky/Services/Registration/GeometrySignposts.swift
      - Bricky/Services/Registration/DepthICPTracker.swift
      - Bricky/Services/Registration/SuggestedPlacementEstimator.swift
      - Bricky/Services/Verification/GeometricStepVerifier.swift
      - Bricky/Services/Verification/StepJudging.swift
      - Bricky/Services/Verification/BuildDiffEngine.swift
      # The RGB term (ADR 0008, M3.1/M3.2): Foundation and simd only.
      - Bricky/Services/Verification/ColourTable.swift
      - Bricky/Services/Verification/SceneColourCalibration.swift
      - Bricky/Services/Verification/ColourAgreementTerm.swift
      - Bricky/Services/Verification/ColourTermJudge.swift
      # Stud labels for photo captures (Phase 4): the upright mapping and
      # the refusal policy, shared with the app.
      - Bricky/Services/Verification/CheckCropGeometry.swift
      - Bricky/Services/Verification/StudLabelPolicy.swift
      - Bricky/Services/Repair/CameraRelativeDirection.swift
      - Bricky/Services/Repair/RepairPlanner.swift
      - Bricky/Services/Repair/CrossStepRepairPlanner.swift
      # Compiles here so geometric recovery can be replayed on a Mac from
      # retained depth frames; it must stay free of UIKit and MLX.
      - Bricky/Services/Recovery/GeometricRecoveryEstimator.swift
      - Bricky/Services/Recovery/GeometricRecoveryReplay.swift
      - Bricky/Services/Recovery/PlacementConsistencyScorer.swift
      - Bricky/Services/Recovery/FitScoring.swift
    dependencies:
      - package: RecoveryMLX
        product: RecoveryEvidenceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bricky.synthetic-rgbd
        CODE_SIGN_IDENTITY: ""
  BrickyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BrickyTests/InstructionParserTests.swift
      - BrickyTests/LDConfigPaletteTests.swift
      - BrickyTests/ModelSurfaceSamplerTests.swift
      - BrickyTests/ExpectedDepthRendererTests.swift
      - BrickyTests/DepthICPTrackerTests.swift
      - BrickyTests/GeometricStepVerifierTests.swift
      - BrickyTests/GeometricRecoveryEstimatorTests.swift
      - BrickyTests/CompositeRecoveryEstimatorTests.swift
      - BrickyTests/ClaudeVisionProviderTests.swift
      - BrickyTests/InstructionPlanTests.swift
      - BrickyTests/InstructionImporterTests.swift
      - BrickyTests/LDrawGeometryEngineTests.swift
      - BrickyTests/RecoveryCaptureTests.swift
      - BrickyTests/RecoveryBenchmarkWriterTests.swift
      - BrickyTests/VLMCheckRowWriterTests.swift
      - BrickyTests/ColourGridSamplerTests.swift
      - BrickyTests/VerificationWindowBufferTests.swift
      - BrickyTests/SegmentedGeometryTests.swift
      - BrickyTests/PlacementGeometryStoreTests.swift
      - BrickyTests/PlacementGeometryIndexTests.swift
      - BrickyTests/RepairPlanningTests.swift
      - BrickyTests/RepairPhrasebookTests.swift
      - BrickyTests/AdvancePolicyTests.swift
      - BrickyTests/VoiceCommandGrammarTests.swift
      - BrickyTests/NextStepIntentTests.swift
      - BrickyTests/InstructionModelEntityTests.swift
      - BrickyTests/CrossStepRepairPlannerTests.swift
      - BrickyTests/PlacementConsistencyScorerTests.swift
      - BrickyTests/SuggestedPlacementTests.swift
      - BrickyTests/RecoveryEvidenceRecorderTests.swift
      - BrickyTests/RecoveryEvidenceSweepTests.swift
      - BrickyTests/SwiftParityTests.swift
      - BrickyTests/RecoveryIndexingTests.swift
      - BrickyTests/DeviceFloorTests.swift
      - BrickyTests/StorageLayoutTests.swift
      - BrickyTests/StepVerificationControllerTests.swift
      - BrickyTests/ARActivityClockTests.swift
      - BrickyTests/RecoveryModelManagerTests.swift
      - BrickyTests/BuildSessionControllerTests.swift
      - BrickyTests/PartDescriptionIndexTests.swift
      - BrickyTests/DocumentOpenRouterTests.swift
      - BrickyTests/InferenceArmSchedulerTests.swift
      - BrickyTests/PhotoCheckControllerTests.swift
      - BrickyTests/VLMStepCheckServiceTests.swift
      - BrickyTests/CheckCropGeometryTests.swift
      - BrickyTests/ColourTableTests.swift
      - BrickyTests/SceneColourCalibrationTests.swift
      - BrickyTests/ColourAgreementTermTests.swift
      - BrickyTests/ColourTermJudgeTests.swift
      - BrickyTests/RepairWordingCoordinatorTests.swift
      - BrickyTests/ShadowCheckRunnerTests.swift
      - BrickyTests/MemoryGovernorTests.swift
      - BrickyTests/BackgroundURLSessionDeliveryTests.swift
      - BrickyTests/PhysicalBuildLabelStoreTests.swift
      - BrickyTests/StudIndexTests.swift
      - BrickyTests/StudLabelPolicyTests.swift
    dependencies:
      - target: Bricky
      - package: RecoveryMLX
        product: RecoveryMLX
      - package: RecoveryMLX
        product: RecoveryEvidenceKit
      - package: RecoveryMLX
        product: BrickyLanguage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bricky.tests
        TARGETED_DEVICE_FAMILY: "1"
  BrickyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BrickyUITests/BrickyUITests.swift
    dependencies:
      - target: Bricky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bricky.uitests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  SyntheticRGBD:
    build:
      targets:
        SyntheticRGBD: all
  Bricky:
    build:
      targets:
        Bricky: all
        BrickyTests: [test]
        BrickyUITests: [test]
    test:
      targets:
        - BrickyTests
        - BrickyUITests
