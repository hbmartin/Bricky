<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bricky Support Inbox</title>
<style>
  :root { --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --secondary:#6b6b70; --blue:#0a84ff; --border:#e5e5ea; --hover:#f6f6f8; --unread:#0a84ff; }
  @media (prefers-color-scheme: dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--secondary:#9a9aa0;--border:#2c2c2e;--hover:#262629;}}
  *{box-sizing:border-box;margin:0;padding:0;} body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);}
  /* Login */
  .auth{max-width:360px;margin:80px auto;padding:0 20px;} .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;}
  h1{font-size:22px;} .sub{color:var(--secondary);font-size:14px;margin:6px 0 16px;}
  input,select{padding:11px;font-size:15px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);}
  .auth input{width:100%;margin-bottom:10px;} .auth button{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;}
  .err{color:#d01012;font-size:14px;min-height:18px;font-weight:600;}
  .hidden{display:none;}
  /* Inbox */
  .wrap{max-width:980px;margin:0 auto;padding:24px;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .title{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;}
  .badge{background:#d01012;color:#fff;font-size:12px;font-weight:700;border-radius:11px;padding:2px 8px;min-width:22px;text-align:center;}
  .signout{padding:8px 16px;font-size:14px;background:transparent;color:var(--blue);border:none;cursor:pointer;font-weight:600;}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;} .bar input{flex:1;min-width:220px;}
  .inq{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;}
  .inq:hover{background:var(--hover);} .inq.unread{border-left:4px solid var(--unread);}
  .ic{flex-shrink:0;width:34px;height:34px;color:var(--secondary);} .inq.unread .ic{color:var(--unread);}
  .body{flex:1;min-width:0;} .meta{display:flex;gap:10px;font-size:13px;color:var(--secondary);margin-bottom:4px;align-items:center;} .topic{font-weight:700;color:var(--blue);}
  .email{font-weight:600;color:var(--text);} .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--secondary);} .inq.unread .msg{color:var(--text);}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--unread);flex-shrink:0;margin-top:12px;} .read .dot{visibility:hidden;}
  .pager{display:flex;justify-content:center;gap:8px;margin-top:16px;align-items:center;color:var(--secondary);font-size:14px;} .pager button{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;} .pager button:disabled{opacity:.4;cursor:default;}
  .empty{text-align:center;color:var(--secondary);padding:40px;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;} .overlay.open{display:flex;}
  .dlg{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:85vh;display:flex;flex-direction:column;} .dlg header{padding:18px 22px;border-bottom:1px solid var(--border);} .dlg .b{padding:18px 22px;overflow-y:auto;white-space:pre-wrap;} .dlg footer{padding:14px 22px;border-top:1px solid var(--border);text-align:right;} .dlg footer button{background:var(--blue);color:#fff;border:none;padding:10px 22px;border-radius:10px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
  <div id="login" class="auth"><div class="card">
    <h1>Support Inbox</h1><div class="sub" id="loginSub">Sign in as ami.</div>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="go">Sign In</button><p class="err" id="err"></p>
  </div></div>

  <div id="app" class="wrap hidden">
    <div class="top">
      <div class="title">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
        Support Inbox <span class="badge hidden" id="badge">0</span>
      </div>
      <button class="signout" id="out">Sign out</button>
    </div>
    <div class="bar">
      <input id="q" list="qlist" placeholder="Search email, topic, message…" /><datalist id="qlist"></datalist>
      <select id="topic"><option value="">All topics</option></select>
      <select id="sort"><option value="date">Newest</option><option value="old">Oldest</option><option value="email">Email A–Z</option><option value="unread">Unread first</option></select>
    </div>
    <div id="list"></div>
    <div class="pager"><button id="prev">Prev</button><span id="pinfo"></span><button id="next">Next</button></div>
  </div>

  <div class="overlay" id="ov" role="dialog" aria-modal="true"><div class="dlg"><header><strong id="dT"></strong><div class="meta" id="dM" style="margin-top:4px;"></div></header><div class="b" id="dB"></div><footer><button id="dC">Close</button></footer></div></div>

  <script>
    const API='https://bricky-recognition.azurewebsites.net/api/inbox';
    const $=id=>document.getElementById(id); let setup=false, all=[], page=0; const PER=10;
    const seen=()=>new Set(JSON.parse(localStorage.bricky_seen||'[]'));
    const mark=id=>{const s=seen();s.add(id);localStorage.bricky_seen=JSON.stringify([...s]);};
    const post=b=>fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json().then(j=>({ok:r.ok,j})));
    (async()=>{const{j}=await post({action:'status'});if(!j.configured){setup=true;$('loginSub').textContent='First time — set your password (username ami).';$('go').textContent='Set Password';$('pw').autocomplete='new-password';}})();
    $('go').onclick=async()=>{$('err').textContent='';const{ok,j}=await post({action:setup?'setup':'login',password:$('pw').value});if(ok&&j.token){sessionStorage.bricky_t=j.token;load();}else $('err').textContent=j.error||'Failed';};
    $('out').onclick=()=>{delete sessionStorage.bricky_t;location.reload();};
    ['q','topic','sort'].forEach(id=>$(id).addEventListener('input',()=>{page=0;render();}));
    $('prev').onclick=()=>{if(page>0){page--;render();}}; $('next').onclick=()=>{page++;render();};
    async function load(){const{ok,j}=await post({action:'list',token:sessionStorage.bricky_t});if(!ok){$('err').textContent='Session expired';return;}all=j.inquiries||[];$('login').classList.add('hidden');$('app').classList.remove('hidden');
      const topics=[...new Set(all.map(x=>x.topic))].sort();$('topic').innerHTML='<option value="">All topics</option>'+topics.map(t=>`<option>${t}</option>`).join('');
      $('qlist').innerHTML=[...new Set(all.map(x=>x.email))].map(e=>`<option value="${e}">`).join('');render();}
    function render(){const s=seen();const q=$('q').value.toLowerCase();const tf=$('topic').value;const so=$('sort').value;
      let rows=all.filter(x=>(!tf||x.topic===tf)&&(!q||(x.email+x.topic+x.message).toLowerCase().includes(q)));
      rows.sort((a,b)=>so==='old'?(a.id<b.id?-1:1):so==='email'?a.email.localeCompare(b.email):so==='unread'?((s.has(a.id)?1:0)-(s.has(b.id)?1:0)):(a.id<b.id?1:-1));
      const unread=all.filter(x=>!s.has(x.id)).length;$('badge').textContent=unread;$('badge').classList.toggle('hidden',unread===0);
      const pages=Math.max(1,Math.ceil(rows.length/PER));if(page>=pages)page=pages-1;const slice=rows.slice(page*PER,page*PER+PER);
      $('list').innerHTML=slice.length?slice.map(x=>{const u=!s.has(x.id);return `<div class="inq ${u?'unread':'read'}" data-id="${x.id}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${u?'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/>':'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/><path d="M2 6l10 7 10-7" opacity=".4"/>'}</svg><div class="body"><div class="meta"><span class="topic">${x.topic}</span><span class="email">${x.email}</span><span>${x.date}</span></div><div class="msg">${x.message.replace(/</g,'&lt;')}</div></div><div class="dot"></div></div>`;}).join(''):'<div class="empty">No messages.</div>';
      $('pinfo').textContent=`${page+1} / ${pages} · ${rows.length} msg`;$('prev').disabled=page<=0;$('next').disabled=page>=pages-1;
      document.querySelectorAll('.inq').forEach(el=>el.onclick=()=>{const x=all.find(a=>a.id===el.dataset.id);mark(el.dataset.id);$('dT').textContent=x.topic;$('dM').textContent=`${x.email} · ${x.date}`;$('dB').textContent=x.message;$('ov').classList.add('open');render();});}
    $('dC').onclick=()=>$('ov').classList.remove('open');$('ov').onclick=e=>{if(e.target===$('ov'))$('ov').classList.remove('open');};
    if(sessionStorage.bricky_t)load();
  </script>
</body>
</html>
