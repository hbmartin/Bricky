name: Instruction parity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyldraw-golden:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Fetch pinned LDraw release asset
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/complete.zip" \
            https://github.com/hbmartin/Bricky/releases/download/ldraw-2026-07/complete.zip
          test "$(wc -c < "$RUNNER_TEMP/complete.zip" | tr -d ' ')" = 144722356
          test "$(shasum -a 256 "$RUNNER_TEMP/complete.zip" | awk '{print $1}')" = 6009f2e94204c4d3a63a4c812010b5c90bad8c5acb19b882c859fdac63734eae
          ditto -x -k "$RUNNER_TEMP/complete.zip" "$RUNNER_TEMP/part-pack"
      - name: Regenerate normalized schema-v1 corpus
        working-directory: Tools/InstructionPipeline
        run: |
          uv sync --frozen
          uv run python -m unittest test_generate_golden.py
          uv run python generate_golden.py --ldraw-root "$RUNNER_TEMP/part-pack/ldraw" --check
      - name: Test recovery evaluation preflight
        working-directory: Tools/RecoveryEvaluation
        run: |
          uv sync --frozen
          uv run python -m unittest test_score_results.py test_check_regression.py test_compare_arms.py test_score_wording_ab.py test_export_training_pairs.py test_phase1_report.py
      - name: Test sensor-model fitting
        working-directory: Tools/SensorCalibration
        run: python3 -m unittest test_fit_sensor_model.py

  synthetic-gates:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Fetch pinned LDraw release asset
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/complete.zip" \
            https://github.com/hbmartin/Bricky/releases/download/ldraw-2026-07/complete.zip
          test "$(wc -c < "$RUNNER_TEMP/complete.zip" | tr -d ' ')" = 144722356
          test "$(shasum -a 256 "$RUNNER_TEMP/complete.zip" | awk '{print $1}')" = 6009f2e94204c4d3a63a4c812010b5c90bad8c5acb19b882c859fdac63734eae
          ditto -x -k "$RUNNER_TEMP/complete.zip" "$RUNNER_TEMP/part-pack"
      - name: Build SyntheticRGBD
        run: |
          xcodebuild -project 'Bricky the Brick Scanner.xcodeproj' -scheme SyntheticRGBD \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation -derivedDataPath "$RUNNER_TEMP/dd" build
      - name: Run SyntheticRGBD
        working-directory: Tools/SyntheticScenes
        run: |
          "$RUNNER_TEMP/dd/Build/Products/Debug/SyntheticRGBD" \
            fixtures/real-tower/tower.ldr \
            --ldraw-root "$RUNNER_TEMP/part-pack/ldraw" \
            --out "$RUNNER_TEMP/synthetic.ndjson" --seed 7
      # Blocking. Asks "is the solver worse than it was?", which needs only a
      # deterministic fixture and a committed baseline — no calibrated truth,
      # so it can gate today. Notably it is the only thing in CI protecting
      # the false-complete rate, the headline safety number of ADR 0008.
      - name: Check regression against baseline
        working-directory: Tools/SyntheticScenes
        run: |
          python3 ../RecoveryEvaluation/check_regression.py \
            "$RUNNER_TEMP/synthetic.ndjson" \
            --baseline fixtures/real-tower/baseline.json
      # Informational. Asks "does the solver meet the CONTEXT.md release
      # gates?", which needs calibrated absolute truth; the constants are
      # still invented (ADR 0014), so registration and verification fail
      # honestly here. Flips to blocking when calibration lands.
      - name: Score synthetic gates (informational)
        working-directory: Tools/SyntheticScenes
        continue-on-error: true
        run: |
          python3 ../RecoveryEvaluation/score_results.py \
            "$RUNNER_TEMP/synthetic.ndjson" --allow-small-corpus
      # The challenge suite: mistake classes the regression taxonomy lacks
      # (Z shift, plate off by one, rotations, wrong part, colour swap), on
      # their own RNG stream and baseline. Blocking on regression only: its
      # baseline records today's known false completes, so a fix reads as
      # an improvement and a new one fails.
      - name: Run SyntheticRGBD challenge suite
        working-directory: Tools/SyntheticScenes
        run: |
          "$RUNNER_TEMP/dd/Build/Products/Debug/SyntheticRGBD" \
            fixtures/challenge/challenge.ldr \
            --ldraw-root "$RUNNER_TEMP/part-pack/ldraw" \
            --out "$RUNNER_TEMP/challenge.ndjson" --seed 7 --suite challenge
      - name: Check challenge regression against baseline
        working-directory: Tools/SyntheticScenes
        run: |
          python3 ../RecoveryEvaluation/check_regression.py \
            "$RUNNER_TEMP/challenge.ndjson" \
            --baseline fixtures/challenge/baseline.json
      - name: Score challenge suite (informational)
        working-directory: Tools/SyntheticScenes
        continue-on-error: true
        run: |
          python3 ../RecoveryEvaluation/score_results.py \
            "$RUNNER_TEMP/challenge.ndjson" --informational
      # Stud-lattice aliasing (Phase 4): one scene per step, ambiguity truth
      # from noise-free renders, its own RNG stream and baseline. Blocking on
      # regression only; whether real LiDAR aliases is a device question.
      - name: Run SyntheticRGBD lattice suite
        working-directory: Tools/SyntheticScenes
        run: |
          "$RUNNER_TEMP/dd/Build/Products/Debug/SyntheticRGBD" \
            fixtures/lattice/lattice.ldr \
            --ldraw-root "$RUNNER_TEMP/part-pack/ldraw" \
            --out "$RUNNER_TEMP/lattice.ndjson" --seed 7 --suite lattice
      - name: Check lattice regression against baseline
        working-directory: Tools/SyntheticScenes
        run: |
          python3 ../RecoveryEvaluation/check_regression.py \
            "$RUNNER_TEMP/lattice.ndjson" \
            --baseline fixtures/lattice/baseline.json
      # The colour-code tag pass (M3.1). No suite draws it, because synthetic
      # scenes carry no colour, so this is the only place its shader is
      # compiled and run on this toolchain: depth must stay bit-identical
      # beside it, and every tag must decode to a colour the step uses.
      - name: Check the colour tag pass
        working-directory: Tools/SyntheticScenes
        run: |
          for fixture in fixtures/challenge/challenge.ldr fixtures/real-tower/tower.ldr; do
            "$RUNNER_TEMP/dd/Build/Products/Debug/SyntheticRGBD" "$fixture" \
              --ldraw-root "$RUNNER_TEMP/part-pack/ldraw" \
              --out "$RUNNER_TEMP/tag-render.ndjson" --check-tag-render
          done
      # Stud labels (Phase 4, ADR 0020): the stud-ID tag pass leaves depth
      # bit-identical, every id names a stud, CPU projection lands on its
      # raster, every stud primitive in the pinned pack is classified, and
      # known parts have their known top-stud counts.
      - name: Check the stud tag pass and catalog
        working-directory: Tools/SyntheticScenes
        run: |
          for fixture in fixtures/challenge/challenge.ldr fixtures/real-tower/tower.ldr; do
            "$RUNNER_TEMP/dd/Build/Products/Debug/SyntheticRGBD" "$fixture" \
              --ldraw-root "$RUNNER_TEMP/part-pack/ldraw" \
              --out "$RUNNER_TEMP/stud-labels.ndjson" --check-stud-labels
          done
      # Repairs (M2.4, M2.9): in-step plans undo a one-stud shift, worded
      # from each view and screen rotation; cross-step plans are replayed on
      # the support graph. Any harmful action fails.
      - name: Run SyntheticRGBD repair suite
        working-directory: Tools/SyntheticScenes
        run: |
          "$RUNNER_TEMP/dd/Build/Products/Debug/SyntheticRGBD" \
            fixtures/challenge/challenge.ldr \
            --ldraw-root "$RUNNER_TEMP/part-pack/ldraw" \
            --out "$RUNNER_TEMP/repair.ndjson" --seed 7 --suite repair
      - name: Check repair regression against baseline
        working-directory: Tools/SyntheticScenes
        run: |
          python3 ../RecoveryEvaluation/check_regression.py \
            "$RUNNER_TEMP/repair.ndjson" \
            --baseline fixtures/challenge/repair-baseline.json
      # Suggested placement (M2.7): off-build and distractor scenes must
      # never get a proposal.
      - name: Run SyntheticRGBD placement suite
        working-directory: Tools/SyntheticScenes
        run: |
          "$RUNNER_TEMP/dd/Build/Products/Debug/SyntheticRGBD" \
            fixtures/challenge/challenge.ldr \
            --ldraw-root "$RUNNER_TEMP/part-pack/ldraw" \
            --out "$RUNNER_TEMP/placement.ndjson" --seed 7 --suite placement
      - name: Check placement regression against baseline
        working-directory: Tools/SyntheticScenes
        run: |
          python3 ../RecoveryEvaluation/check_regression.py \
            "$RUNNER_TEMP/placement.ndjson" \
            --baseline fixtures/challenge/placement-suggestion-baseline.json
      # Geometric recovery (M2.6), with the placement tie-break off (control)
      # and on. Each arm is held to its own baseline; the paired comparison
      # is informational until device replays exist (ADR 0010).
      - name: Run SyntheticRGBD recovery suite (both arms)
        working-directory: Tools/SyntheticScenes
        run: |
          for arm in control tiebreak; do
            "$RUNNER_TEMP/dd/Build/Products/Debug/SyntheticRGBD" \
              fixtures/challenge/challenge.ldr \
              --ldraw-root "$RUNNER_TEMP/part-pack/ldraw" \
              --out "$RUNNER_TEMP/recovery-$arm.ndjson" --seed 7 \
              --suite recovery --recovery-arm "$arm" \
              --write-bundle "$RUNNER_TEMP/recovery-bundle-$arm"
          done
      # Blocking. The suite's scenarios, written as an evidence bundle by the
      # device's own depth writer, must replay to the same fits bit for bit:
      # the round trip a Phase 1 bundle takes. Fits, not rows, because every
      # synthetic estimate abstains and abstentions would agree trivially.
      - name: Replay the recovery bundles (both arms)
        working-directory: Tools/SyntheticScenes
        run: |
          for arm in control tiebreak; do
            "$RUNNER_TEMP/dd/Build/Products/Debug/SyntheticRGBD" \
              fixtures/challenge/challenge.ldr \
              --ldraw-root "$RUNNER_TEMP/part-pack/ldraw" \
              --replay-bundle "$RUNNER_TEMP/recovery-bundle-$arm" \
              --suite recovery --recovery-arm "$arm" --require-match \
              --out "$RUNNER_TEMP/recovery-replay-$arm.ndjson"
          done
      - name: Check recovery regression against baselines
        working-directory: Tools/SyntheticScenes
        run: |
          for arm in control tiebreak; do
            python3 ../RecoveryEvaluation/check_regression.py \
              "$RUNNER_TEMP/recovery-$arm.ndjson" \
              --baseline "fixtures/challenge/recovery-$arm-baseline.json"
          done
      - name: Compare recovery arms (informational)
        working-directory: Tools/SyntheticScenes
        continue-on-error: true
        run: |
          python3 ../RecoveryEvaluation/compare_arms.py \
            --control "$RUNNER_TEMP/recovery-control.ndjson" \
            --variant "$RUNNER_TEMP/recovery-tiebreak.ndjson" --primary session_top1

  swift-parity:
    # The Xcode 27 image carries the iOS 27 SDK required by the project's
    # deployment target; building and testing here is also the workflow's
    # iOS 27 build check.
    runs-on: xcode-27
    # A cold build compiles mlx-swift's C++ and Metal sources; the build
    # and the test run have their own limits so a stall shows which it was.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # mlx-swift compiles .metal sources, and Xcode 27 ships the Metal
      # compiler as a separately downloaded component.
      - name: Ensure Metal Toolchain
        run: |
          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q 'Status: installed'; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      # The Core AI stud keypoint seam (ADR 0020) is under canImport(CoreAI),
      # which the Simulator SDK lacks, so the build below compiles it out.
      # Type-check it against the device SDK instead: seconds, where a full
      # generic iOS build would recompile mlx-swift. The probe fails if the
      # SDK has no Core AI at all.
      - name: Type-check the Core AI seam against the device SDK
        run: |
          xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios27.0 -swift-version 5 \
            Bricky/Services/Verification/StudKeypointDetecting.swift \
            Bricky/Services/Verification/CoreAIStudKeypointDetector.swift \
            Tools/CI/CoreAIProbe.swift
      # The floor device (ADR 0012) is the test device. The runner image
      # does not pre-create an iPhone 17 Pro, but Xcode 27 ships its device
      # type, so create one when it is missing.
      - name: Ensure iPhone 17 Pro simulator
        run: |
          if ! xcrun simctl list devices available | grep -q 'iPhone 17 Pro ('; then
            xcrun simctl create 'iPhone 17 Pro' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
          fi
      # UI tests run too: they force a device-floor verdict with a Debug-only
      # launch argument, because the Simulator has no LiDAR and would
      # otherwise only ever show the unsupported screen.
      - name: Build for testing
        timeout-minutes: 65
        run: |
          xcodebuild -project 'Bricky the Brick Scanner.xcodeproj' -scheme Bricky \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation \
            -showBuildTimingSummary build-for-testing
      - name: Run native parity and UI tests
        timeout-minutes: 40
        run: |
          xcodebuild -project 'Bricky the Brick Scanner.xcodeproj' -scheme Bricky \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation \
            -parallel-testing-enabled NO test-without-building \
            -only-testing:BrickyTests -only-testing:BrickyUITests

  harness-macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build bricky-harness and run package tests
        working-directory: Packages/RecoveryMLX
        run: |
          swift build --build-tests
          swift test
      # The Phase 1 report end to end on a synthetic bundle: validation and
      # lattice rows run through the real harness; model-gated steps print.
      - name: Phase 1 report smoke
        run: |
          harness="$(swift build --package-path Packages/RecoveryMLX --show-bin-path)/bricky-harness"
          "$harness" synth-bundle --out "$RUNNER_TEMP/p1-bundle"
          python3 -I Tools/RecoveryEvaluation/phase1_report.py "$RUNNER_TEMP/p1-bundle" \
            --work "$RUNNER_TEMP/p1-report" --harness "$harness" | tee "$RUNNER_TEMP/p1.out"
          grep -q "^STEP validate p1-bundle exit=0" "$RUNNER_TEMP/p1.out"
          grep -q "^STEP lattice-rows exit=0" "$RUNNER_TEMP/p1.out"
          test -s "$RUNNER_TEMP/p1-report/phase1_report.json"
