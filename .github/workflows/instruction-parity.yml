name: Instruction parity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyldraw-golden:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Fetch pinned LDraw release asset
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/complete.zip" \
            https://github.com/hbmartin/Bricky/releases/download/ldraw-2026-07/complete.zip
          test "$(wc -c < "$RUNNER_TEMP/complete.zip" | tr -d ' ')" = 144722356
          test "$(shasum -a 256 "$RUNNER_TEMP/complete.zip" | awk '{print $1}')" = 6009f2e94204c4d3a63a4c812010b5c90bad8c5acb19b882c859fdac63734eae
          ditto -x -k "$RUNNER_TEMP/complete.zip" "$RUNNER_TEMP/part-pack"
      - name: Regenerate normalized schema-v1 corpus
        working-directory: Tools/InstructionPipeline
        run: |
          uv sync --frozen
          uv run python -m unittest test_generate_golden.py
          uv run python generate_golden.py --ldraw-root "$RUNNER_TEMP/part-pack/ldraw" --check
      - name: Test recovery evaluation preflight
        working-directory: Tools/RecoveryEvaluation
        run: |
          uv sync --frozen
          uv run python -m unittest test_score_results.py

  # Informational until the sensor constants are calibrated against real
  # device captures (see SyntheticRGBDMain calibration status): the
  # registration and verification gates fail honestly on the RECONSTRUCTED
  # sensor model, so this job reports without blocking merges yet.
  synthetic-gates:
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Fetch pinned LDraw release asset
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/complete.zip" \
            https://github.com/hbmartin/Bricky/releases/download/ldraw-2026-07/complete.zip
          test "$(wc -c < "$RUNNER_TEMP/complete.zip" | tr -d ' ')" = 144722356
          test "$(shasum -a 256 "$RUNNER_TEMP/complete.zip" | awk '{print $1}')" = 6009f2e94204c4d3a63a4c812010b5c90bad8c5acb19b882c859fdac63734eae
          ditto -x -k "$RUNNER_TEMP/complete.zip" "$RUNNER_TEMP/part-pack"
      - name: Build SyntheticRGBD
        run: |
          xcodebuild -project 'Bricky the Brick Scanner.xcodeproj' -scheme SyntheticRGBD \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation -derivedDataPath "$RUNNER_TEMP/dd" build
      - name: Run synthetic gates
        working-directory: Tools/SyntheticScenes
        run: |
          "$RUNNER_TEMP/dd/Build/Products/Debug/SyntheticRGBD" \
            fixtures/real-tower/tower.ldr \
            --ldraw-root "$RUNNER_TEMP/part-pack/ldraw" \
            --out "$RUNNER_TEMP/synthetic.ndjson" --seed 7
          python3 ../RecoveryEvaluation/score_results.py \
            "$RUNNER_TEMP/synthetic.ndjson" --allow-small-corpus

  swift-parity:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and run native parity tests
        run: |
          xcodebuild -project 'Bricky the Brick Scanner.xcodeproj' -scheme Bricky \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation \
            -parallel-testing-enabled NO test -only-testing:BrickyTests

  harness-macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build bricky-harness and run package tests
        working-directory: Packages/RecoveryMLX
        run: |
          swift build --build-tests
          swift test
